version: "3.9"

name: xchange-local

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: xchange-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: xchange
      POSTGRES_PASSWORD: xchange_local_dev
      POSTGRES_DB: xchange
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xchange -d xchange"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: xchange-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: xchange-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  mailhog:
    image: mailhog/mailhog:latest
    container_name: xchange-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
    container_name: xchange-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      API_PORT: 4000
      API_HOST: 0.0.0.0
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://xchange:xchange_local_dev@postgres:5432/xchange?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: xchange-media
      JWT_ACCESS_SECRET: xchange-docker-jwt-access-secret-key-2026
    ports:
      - "4000:4000"

  web:
    build:
      context: ..
      dockerfile: Dockerfile
      target: web
    container_name: xchange-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4000/rt
      NEXT_PUBLIC_CDN_URL: http://localhost:9000/xchange-media
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  minio_data:
